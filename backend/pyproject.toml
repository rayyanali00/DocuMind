[project]
name = "documind-backend"
version = "0.1.0"
description = "AI-Powered Contextual Document Finder - Backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    # Persistence
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    # Async work
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # Document extractors
    "python-magic>=0.4.27",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    # OCR
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "pdf2image>=1.17.0",
    # YouTube
    "yt-dlp>=2024.11.4",
    "youtube-transcript-api>=0.6.2",
    # AI / retrieval
    "sentence-transformers>=3.3.0",
    "torch>=2.4.0",
    "numpy>=1.26.0,<2.0.0",
    "qdrant-client>=1.12.0",
    "opensearch-py>=2.7.1",
    # Chunking
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-huggingface>=0.4.0",
    # Logging
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
